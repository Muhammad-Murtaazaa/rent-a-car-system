name: Keep Render App Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier from sleeping (15 min inactivity limit)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_APP_URL secret not set. Skipping ping."
            exit 0
          fi
          echo "Pinging $URL/api/health..."
          curl -s -f -m 30 "$URL/api/health" || curl -s -f -m 30 "$URL" || true
